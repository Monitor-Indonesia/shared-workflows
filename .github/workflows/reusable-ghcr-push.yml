name: Reusable GHCR Build and Push (Staging)

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        description: "Image name on GHCR (default: repository name)"
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      COMPOSE_SERVICE:
        description: "Service name in docker-compose.yml on the VPS"
        required: true
        type: string
      COMPOSE_DIR:
        description: "Directory on the VPS containing docker-compose.yml"
        required: false
        type: string
        default: "/opt/monitor-staging"
      DEPLOY:
        description: "Deploy to the staging VPS after pushing the image"
        required: false
        type: boolean
        default: true
      BUILD_ARGS:
        description: "Extra docker build --build-arg values, one KEY=VALUE per line (e.g. NEXT_PUBLIC_BASE_URL=https://monitordev.space)"
        required: false
        type: string
        default: ""
    secrets:
      NPM_TOKEN:
        required: false
      VPS_HOST:
        required: false
      VPS_USER:
        required: false
      VPS_SSH_KEY:
        required: false
      INTERNAL_JWT_SECRET:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      CLOUDFLARE_TOKEN_API:
        required: false

concurrency:
  group: staging-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.build-image.outputs.image_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, Tag, and Push to GHCR
        id: build-image
        env:
          IMAGE_NAME: ${{ inputs.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUILD_ARGS: ${{ inputs.BUILD_ARGS }}
        run: |
          # GHCR requires a lowercase namespace
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME,,}"

          DOCKER_FLAGS=

          if [ -z "$NPM_TOKEN" ]; then
            echo "No NPM_TOKEN found, building standard image."
          else
            echo "NPM_TOKEN detected, using secret mount."
            DOCKER_FLAGS="--secret id=npm_token,env=NPM_TOKEN"
          fi

          # Each non-empty line of BUILD_ARGS becomes one --build-arg KEY=VALUE.
          # Needed so NEXT_PUBLIC_* (inlined into the JS bundle at build time,
          # not at container start) resolve to staging values, not the
          # Dockerfile's production defaults.
          BUILD_ARG_FLAGS=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            BUILD_ARG_FLAGS+=(--build-arg "$line")
          done <<< "$BUILD_ARGS"

          docker build $DOCKER_FLAGS "${BUILD_ARG_FLAGS[@]}" \
            -t $GHCR_IMAGE:$IMAGE_TAG \
            -t $GHCR_IMAGE:staging .

          docker push $GHCR_IMAGE:$IMAGE_TAG
          docker push $GHCR_IMAGE:staging

          echo "image_sha=$GHCR_IMAGE:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-to-vps:
    needs: build-and-push
    if: ${{ inputs.DEPLOY }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ inputs.COMPOSE_DIR }}
            docker compose pull ${{ inputs.COMPOSE_SERVICE }}
            docker compose up -d ${{ inputs.COMPOSE_SERVICE }}
            docker image prune -f
